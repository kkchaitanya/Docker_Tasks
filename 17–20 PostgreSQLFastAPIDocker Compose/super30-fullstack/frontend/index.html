
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super30 | CRUD Dashboard</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }

    header {
      background: #172554;
      color: white;
      padding: 24px 7%;
    }

    header h1 { margin: 0 0 8px; }
    header p { margin: 0; color: #cbd5e1; }

    main {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .status-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 22px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 12px;
      box-shadow: 0 3px 12px #0f172a0c;
      margin-bottom: 20px;
    }

    .status-value {
      font-size: 20px;
      font-weight: bold;
      margin-top: 12px;
    }

    .ok { color: #15803d; }
    .bad { color: #dc2626; }

    form {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    input {
      flex: 1;
      min-width: 200px;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      border: none;
      padding: 11px 16px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .primary { background: #2563eb; color: white; }
    .secondary { background: #e2e8f0; color: #172033; }
    .edit { background: #fef3c7; color: #92400e; }
    .delete { background: #fee2e2; color: #991b1b; }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 15px 12px;
      border-bottom: 1px solid #e2e8f0;
    }

    th {
      background: #f8fafc;
      color: #475569;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    #message {
      margin: 15px 0 0;
      font-size: 14px;
    }

    .muted { color: #64748b; }

    footer {
      text-align: center;
      padding: 25px;
      color: #64748b;
    }

    @media (max-width: 600px) {
      header { padding: 22px; }
      main { padding: 0 12px; }
      .actions { flex-wrap: wrap; }
    }
  </style>
</head>

<body>
  <header>
    <h1>Super30 CRUD Dashboard</h1>
    <p>Manage items with FastAPI, PostgreSQL and Docker</p>
  </header>

  <main>
    <section class="status-grid">
      <div class="card">
        <div class="muted">API Status</div>
        <div id="apiStatus" class="status-value">Checking...</div>
      </div>

      <div class="card">
        <div class="muted">Database Status</div>
        <div id="dbStatus" class="status-value">Checking...</div>
      </div>

      <div class="card">
        <div class="muted">Total Items</div>
        <div id="totalItems" class="status-value">—</div>
      </div>
    </section>

    <section class="card">
      <h2 id="formTitle">Create New Item</h2>

      <form id="itemForm">
        <input
          id="itemName"
          type="text"
          maxlength="200"
          placeholder="Enter item name"
          aria-label="Item name"
          required
        >

        <button class="primary" id="submitButton" type="submit">
          Add Item
        </button>

        <button
          class="secondary"
          id="cancelButton"
          type="button"
          hidden
        >
          Cancel
        </button>
      </form>

      <p id="message" role="status" aria-live="polite"></p>
    </section>

    <section class="card">
      <div class="toolbar">
        <div>
          <h2 style="margin:0 0 6px">Items</h2>
          <span class="muted">View, update or delete saved records</span>
        </div>

        <button class="secondary" id="refreshButton" type="button">
          Refresh
        </button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Item Name</th>
              <th>Actions</th>
            </tr>
          </thead>

          <tbody id="itemsTable">
            <tr>
              <td colspan="3">Loading items...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>Super30 · Three-tier Docker Application</footer>

  <script>
    // Nginx forwards /api/... requests to the FastAPI container.
    const API = "/api";

    let items = [];
    let editingId = null;
    let saving = false;

    const $ = id => document.getElementById(id);

    async function apiRequest(path, options = {}) {
      const response = await fetch(API + path, {
        ...options,
        headers: {
          ...(options.body ? { "Content-Type": "application/json" } : {}),
          ...options.headers
        }
      });

      if (!response.ok) {
        let detail = `Request failed (${response.status})`;

        try {
          const error = await response.json();
          if (typeof error.detail === "string") {
            detail = error.detail;
          } else if (error.detail) {
            detail = JSON.stringify(error.detail);
          }
        } catch {}

        throw new Error(detail);
      }

      if (response.status === 204) return null;
      return response.json();
    }

    function showMessage(message, success = true) {
      $("message").textContent = message;
      $("message").className = success ? "ok" : "bad";
    }

    async function checkHealth() {
      try {
        const health = await apiRequest("/health");

        $("apiStatus").textContent = "Healthy";
        $("apiStatus").className = "status-value ok";

        const connected = health.database === "connected";
        $("dbStatus").textContent = connected ? "Connected" : "Unavailable";
        $("dbStatus").className =
          "status-value " + (connected ? "ok" : "bad");
      } catch {
        $("apiStatus").textContent = "Unavailable";
        $("apiStatus").className = "status-value bad";

        $("dbStatus").textContent = "Unavailable";
        $("dbStatus").className = "status-value bad";
      }
    }

    function renderItems() {
      const tbody = $("itemsTable");
      tbody.replaceChildren();

      $("totalItems").textContent = items.length;

      if (items.length === 0) {
        const tr = document.createElement("tr");
        const td = document.createElement("td");
        td.colSpan = 3;
        td.className = "muted";
        td.textContent = "No items found. Create your first item above.";
        tr.appendChild(td);
        tbody.appendChild(tr);
        return;
      }

      items.forEach(item => {
        const tr = document.createElement("tr");

        const id = document.createElement("td");
        id.textContent = item.id;

        const name = document.createElement("td");
        name.textContent = item.name;

        const actions = document.createElement("td");
        const actionGroup = document.createElement("div");
        actionGroup.className = "actions";

        const editButton = document.createElement("button");
        editButton.className = "edit";
        editButton.textContent = "Edit";
        editButton.addEventListener("click", () => startEdit(item));

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete";
        deleteButton.textContent = "Delete";
        deleteButton.addEventListener("click", () => deleteItem(item));

        actionGroup.append(editButton, deleteButton);
        actions.appendChild(actionGroup);
        tr.append(id, name, actions);
        tbody.appendChild(tr);
      });
    }

    async function loadItems() {
      $("refreshButton").disabled = true;

      try {
        items = await apiRequest("/items");
        renderItems();
      } catch (error) {
        $("itemsTable").replaceChildren();

        const tr = document.createElement("tr");
        const td = document.createElement("td");
        td.colSpan = 3;
        td.textContent = "Could not load items: " + error.message;

        tr.appendChild(td);
        $("itemsTable").appendChild(tr);
        $("totalItems").textContent = "—";
      } finally {
        $("refreshButton").disabled = false;
      }
    }

    function startEdit(item) {
      editingId = item.id;
      $("itemName").value = item.name;
      $("formTitle").textContent = `Edit Item #${item.id}`;
      $("submitButton").textContent = "Save Changes";
      $("cancelButton").hidden = false;
      showMessage("Editing item #" + item.id);
      $("itemName").focus();
      $("formTitle").scrollIntoView({ behavior: "smooth", block: "center" });
    }

    function resetForm() {
      editingId = null;
      $("itemForm").reset();
      $("formTitle").textContent = "Create New Item";
      $("submitButton").textContent = "Add Item";
      $("cancelButton").hidden = true;
    }

    $("itemForm").addEventListener("submit", async event => {
      event.preventDefault();
      if (saving) return;

      const name = $("itemName").value.trim();

      if (!name) {
        showMessage("Please enter an item name.", false);
        return;
      }

      saving = true;
      $("submitButton").disabled = true;

      try {
        if (editingId !== null) {
          const id = editingId;

          await apiRequest("/items/" + id, {
            method: "PUT",
            body: JSON.stringify({ name })
          });

          showMessage("Item updated successfully.");
        } else {
          await apiRequest("/items?name="+name
          , {
            method: "POST",
        //     body: JSON.stringify({ name })
          }
        );

          showMessage("Item created successfully.");
        }

        resetForm();
        await loadItems();
      } catch (error) {
        showMessage(error.message, false);
      } finally {
        saving = false;
        $("submitButton").disabled = false;
      }
    });

    async function deleteItem(item) {
      if (!confirm(`Delete "${item.name}" (ID ${item.id})?`)) return;

      try {
        await apiRequest("/items/" + item.id, {
          method: "DELETE"
        });

        if (editingId === item.id) resetForm();

        showMessage("Item deleted successfully.");
        await loadItems();
      } catch (error) {
        showMessage(error.message, false);
      }
    }

    $("cancelButton").addEventListener("click", () => {
      resetForm();
      showMessage("Edit cancelled.");
    });

    $("refreshButton").addEventListener("click", async () => {
      await checkHealth();
      await loadItems();
    });

    checkHealth();
    loadItems();
  </script>
</body>
</html>
